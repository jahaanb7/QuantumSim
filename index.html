<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070e" />
  <meta name="description" content="Interactive 3D visualizations of atomic probability densities and quantum tunneling." />
  <title>QuantumSim — Interactive 3D quantum lab</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/elements" aria-label="QuantumSim home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none">
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="36" y2="36">
                <stop offset="0" stop-color="#6ff0ff" />
                <stop offset="1" stop-color="#b08cff" />
              </linearGradient>
            </defs>
            <ellipse cx="18" cy="18" rx="14" ry="5.6" transform="rotate(32 18 18)" stroke="url(#brandGrad)" stroke-width="1.2" opacity=".9" />
            <ellipse cx="18" cy="18" rx="14" ry="5.6" transform="rotate(-32 18 18)" stroke="url(#brandGrad)" stroke-width="1.2" opacity=".55" />
            <ellipse cx="18" cy="18" rx="5.6" ry="14" transform="rotate(32 18 18)" stroke="url(#brandGrad)" stroke-width="1.2" opacity=".3" />
            <circle cx="18" cy="18" r="2.7" fill="url(#brandGrad)" />
            <circle cx="31.2" cy="12.2" r="1.5" fill="#6ff0ff" />
          </svg>
        </span>
        <span class="brand-name">Quantum<span>Sim</span></span>
      </a>

      <nav class="nav" aria-label="Sections">
        <a class="nav-link" data-route="elements" href="#/elements">
          <span class="nav-orb" aria-hidden="true"></span>
          Chemical Elements
        </a>
        <a class="nav-link" data-route="configurations" href="#/configurations">
          <span class="nav-orb" aria-hidden="true"></span>
          Quantum Configurations
        </a>
      </nav>

      <div class="topbar-meta" aria-hidden="true">
        <span class="live-dot"></span>
        <span>Interactive 3D</span>
        <span class="meta-divider"></span>
        <span class="mono">TDSE · split-step</span>
      </div>
    </header>

    <main id="app" class="app-main"></main>
  </div>

  <noscript>
    <div class="noscript">QuantumSim needs JavaScript to run its simulations.</div>
  </noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
