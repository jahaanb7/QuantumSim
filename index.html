<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <script>
    // Apply the stored theme before the first paint to avoid a flash.
    try {
      var stored = localStorage.getItem("quantumsim-theme");
      document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
    } catch (error) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <meta name="description" content="Build hydrogen-like orbitals by changing n, l, and m, then explore wavefunctions and quantum tunneling." />
  <title>QuantumSim — a small quantum atlas</title>
  <link rel="preload" href="fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <a class="wordmark" href="#/elements" aria-label="QuantumSim home">
        <span class="wordmark-mark" aria-hidden="true">Ψ</span>
        <span class="wordmark-text">QuantumSim</span>
        <span class="wordmark-tag">a small quantum atlas</span>
      </a>

      <nav class="nav" aria-label="Sections">
        <a class="nav-link" data-route="elements" href="#/elements">
          <span class="nav-num">01</span> Builder
        </a>
        <a class="nav-link" data-route="wavefunction" href="#/wavefunction">
          <span class="nav-num">02</span> Wavefunction
        </a>
        <a class="nav-link" data-route="configurations" href="#/configurations">
          <span class="nav-num">03</span> Tunneling
        </a>
      </nav>

      <div class="masthead-tools">
        <div class="masthead-meta">
          <span class="status-dot" aria-hidden="true"></span>
          <span>local compute · no server</span>
        </div>
        <button
          class="theme-toggle"
          type="button"
          role="switch"
          aria-checked="true"
          aria-label="Switch to light theme"
          data-theme-toggle
        >
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb"></span>
          </span>
          <span class="theme-toggle-label" data-theme-label>Dark</span>
        </button>
      </div>
    </header>

    <main id="app" class="app-main"></main>
  </div>

  <noscript>
    <div class="noscript">QuantumSim needs JavaScript to run its simulations.</div>
  </noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
